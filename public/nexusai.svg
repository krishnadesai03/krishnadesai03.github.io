<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8faf6"/>
      <stop offset="100%" stop-color="#eef1e8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Employee question -->
  <g>
    <rect x="300" y="28" width="200" height="56" rx="28" fill="#1C2314"/>
    <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Employee Question</text>
  </g>

  <!-- Arrow down to orchestrator -->
  <line x1="400" y1="84" x2="400" y2="128" stroke="#9bab80" stroke-width="3"/>
  <polygon points="400,138 393,124 407,124" fill="#9bab80"/>

  <!-- Orchestrator -->
  <g>
    <rect x="260" y="140" width="280" height="76" rx="14" fill="#ffffff" stroke="#1C2314" stroke-width="2.5"/>
    <text x="400" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1C2314">Orchestrator</text>
    <text x="400" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b6650">Routes each question to the right agent</text>
  </g>

  <!-- Branch lines -->
  <path d="M 260 178 C 150 178, 150 260, 150 260" fill="none" stroke="#9bab80" stroke-width="3"/>
  <polygon points="150,270 143,256 157,256" fill="#9bab80"/>

  <path d="M 540 178 C 650 178, 650 260, 650 260" fill="none" stroke="#9bab80" stroke-width="3"/>
  <polygon points="650,270 643,256 657,256" fill="#9bab80"/>

  <!-- Knowledge Agent -->
  <g>
    <rect x="40" y="272" width="220" height="98" rx="14" fill="#ffffff" stroke="#9bab80" stroke-width="2.5"/>
    <text x="150" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1C2314">Knowledge Agent</text>
    <text x="150" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6650">Company docs &amp; policies</text>
    <text x="150" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6650">RAG · pgvector · embeddings</text>
  </g>

  <!-- Performance Agent -->
  <g>
    <rect x="540" y="272" width="220" height="98" rx="14" fill="#ffffff" stroke="#9bab80" stroke-width="2.5"/>
    <text x="650" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1C2314">Performance Agent</text>
    <text x="650" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6650">Tickets, sprints &amp; commits</text>
    <text x="650" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b6650">Structured queries</text>
  </g>

  <!-- Down to answer -->
  <path d="M 150 370 C 150 430, 400 430, 400 430" fill="none" stroke="#1C2314" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M 650 370 C 650 430, 400 430, 400 430" fill="none" stroke="#1C2314" stroke-width="2.5" stroke-dasharray="5 5"/>
  <polygon points="400,442 393,428 407,428" fill="#1C2314"/>

  <g>
    <rect x="300" y="444" width="200" height="44" rx="22" fill="#1C2314"/>
    <text x="400" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Grounded Answer</text>
  </g>
</svg>
